<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa del libro — Biblioteca Virtual GEB University</title>
<meta property="og:title" content="Biblioteca Virtual GEB University">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--navy:#1a2744;--navy-deep:#0f1829;--gold:#c9a84c;--gold-light:#e8c97a;--gold-pale:#f5e9c8;--cream:#f8f4eb;--cream-dark:#ede8db;--text-dark:#1a2744;--text-mid:#4a5568;--text-light:#8a9bb0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Lato',sans-serif;background:var(--navy-deep);color:var(--text-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.preview-card{background:var(--cream);border-radius:14px;border:1px solid var(--gold);max-width:520px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.preview-header{background:var(--navy-deep);padding:16px 22px;border-bottom:1px solid var(--gold);}
.preview-header p{font-size:10px;color:var(--gold-light);font-weight:300;letter-spacing:2px;text-transform:uppercase;}
.preview-header h1{font-family:'Playfair Display',serif;font-size:16px;color:#fff;font-weight:700;margin-top:2px;}
.preview-body{padding:26px;display:flex;gap:20px;}
.preview-cover{width:130px;height:190px;border-radius:8px;overflow:hidden;flex-shrink:0;position:relative;background:var(--navy);}
.preview-cover img{width:100%;height:100%;object-fit:cover;object-position:top;}
.preview-cover-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;color:var(--gold-pale);}
.preview-cover-fallback .stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold);opacity:0.5;}
.preview-cover-fallback strong{font-family:'Playfair Display',serif;font-size:13px;line-height:1.3;}
.preview-cover-fallback span{font-size:10px;opacity:0.7;margin-top:4px;}
.preview-info{flex:1;min-width:0;}
.preview-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:4px;}
.preview-author{font-size:13px;color:var(--text-light);margin-bottom:8px;}
.preview-cat{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:3px 9px;border-radius:4px;background:var(--gold-pale);color:var(--navy);margin-bottom:10px;}
.preview-desc{font-size:13px;color:var(--text-mid);line-height:1.5;margin-bottom:18px;}
.preview-read-btn{font-size:13px;font-weight:700;padding:9px 18px;border-radius:8px;background:var(--navy);color:var(--gold-light);border:none;cursor:pointer;font-family:'Lato',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background 0.2s;}
.preview-read-btn:hover{background:var(--navy-deep);}
.preview-read-btn.disabled{background:#d1d5db;color:#9ca3af;cursor:not-allowed;pointer-events:none;}
.preview-footer{padding:12px 26px 20px;text-align:center;}
.preview-footer a{font-size:11px;color:var(--text-light);text-decoration:none;}
.preview-footer a:hover{color:var(--gold);}
.preview-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 26px;color:var(--text-light);text-align:center;}
.preview-state i{font-size:40px;margin-bottom:12px;}
.preview-state p{font-size:14px;}
@media(max-width:480px){.preview-body{flex-direction:column;align-items:center;text-align:center;}.preview-cover{width:150px;height:220px;}}
</style>
</head>
<body>
<div class="preview-card">
  <div class="preview-header">
    <p>Biblioteca Virtual</p>
    <h1>GEB University</h1>
  </div>
  <div id="content">
    <div class="preview-state"><div class="spinner"></div><p>Cargando libro...</p></div>
  </div>
</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyDZSp3_NFYh0-LZXq8KPBFIhmRN2t1svtJJLM0KeP-FAcYqycfuiL2cCnA7qG4gdW7lA/exec';

function sheetToRows(rows,parseExtra){
  if(!rows||rows.length<2) return [];
  const h=rows[0];
  return rows.slice(1).filter(r=>r[0]).map(r=>{
    const o={};h.forEach((k,i)=>o[k]=r[i]||'');
    o.id=parseInt(o.id)||0;
    if(parseExtra)parseExtra(o);
    return o;
  });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderState(iconClass,msg){
  document.getElementById('content').innerHTML=`<div class="preview-state"><i class="ti ${iconClass}"></i><p>${msg}</p></div>`;
}

function renderBook(book,catLabel){
  const c=document.getElementById('content');
  const coverHtml=book.cover
    ?`<img src="${escapeHtml(book.cover)}" alt="Portada" onerror="this.parentElement.innerHTML=fallbackCoverHtml('${escapeHtml(book.title).replace(/'/g,"\\'")}','${escapeHtml(book.author).replace(/'/g,"\\'")}')">`
    :fallbackCoverHtml(escapeHtml(book.title),escapeHtml(book.author));
  const readBtn=book.link
    ?`<a class="preview-read-btn" href="${escapeHtml(book.link)}" target="_blank" rel="noopener"><i class="ti ti-book"></i> Leer / Descargar</a>`
    :`<span class="preview-read-btn disabled"><i class="ti ti-lock"></i> No disponible</span>`;
  c.innerHTML=`
    <div class="preview-body">
      <div class="preview-cover">${coverHtml}</div>
      <div class="preview-info">
        <div class="preview-title">${escapeHtml(book.title)}</div>
        <div class="preview-author">${escapeHtml(book.author)}</div>
        ${catLabel?`<span class="preview-cat">${escapeHtml(catLabel)}</span>`:''}
        <div class="preview-desc">${escapeHtml(book.desc)}</div>
        ${readBtn}
      </div>
    </div>
    <div class="preview-footer"><a href="index.html">Ver todo el catálogo →</a></div>
  `;
}

function fallbackCoverHtml(title,author){
  return `<div class="preview-cover-fallback"><div class="stripe"></div><strong>${title}</strong><span>${author}</span></div>`;
}

async function init(){
  const params=new URLSearchParams(location.search);
  const id=parseInt(params.get('id'));
  if(!id){renderState('ti-alert-circle','Falta el ID del libro en la URL. Usa book.html?id=NUMERO');return;}
  try{
    const r=await fetch(SCRIPT_URL);
    const data=await r.json();
    const books=sheetToRows(data.Libros||[]);
    const cats=sheetToRows(data.Categorias||[]);
    const book=books.find(b=>b.id===id);
    if(!book){renderState('ti-mood-sad','No se encontró ese libro en el catálogo.');return;}
    const cat=cats.find(c=>c.id===book.cat);
    renderBook(book,cat?cat.label:'');
    document.title=book.title+' — Biblioteca Virtual GEB University';
  }catch(e){
    console.error(e);
    renderState('ti-wifi-off','No se pudo cargar la información del libro. Intenta de nuevo más tarde.');
  }
}
init();
</script>
</body>
</html>
